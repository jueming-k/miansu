<script>
App.mount('review');

/* ══════ 6 模块定义 ══════ */
const MODULES = [
  { n: 1, t: '当场基础信息', src: '面试记录带入 + 补填', grad: 'var(--g-aurora)',
    fields: [
      ['interviewer', '面试官角色', '如 业务负责人 / HR / 未来直属 leader'],
      ['duration', '面试时长', '如 45 分钟'],
      ['atmosphere', '面试氛围', '如 偏压力面 / 轻松聊天 / 追问细节', 2]
    ]},
  { n: 2, t: '问题与作答记录', src: '转写结果预填 · 可编辑', grad: 'var(--g-cool)',
    fields: [
      ['transcript', '逐字稿 / 关键问答', '可从「录音转写」页自动带入', 2],
      ['stuck', '卡壳 / 未答上的问题', '逐条列出，这是最值得复盘的素材', 2]
    ]},
  { n: 3, t: '核心深度复盘', src: 'AI 映射', grad: 'var(--g-warm)',
    fields: [
      ['point', '考察点', '这道题到底在考察什么能力'],
      ['strength', '自身优势', 'AI 由「亮点」映射'],
      ['gap', '作答漏洞', 'AI 由「改进建议」映射'],
      ['better', '优化标准答案', '重写一版更好的回答', 2]
    ]},
  { n: 4, t: '面试官意向信号', src: '用户自填', grad: 'var(--g-mint)',
    fields: [
      ['positive', '积极信号', '如 主动介绍团队、追问入职时间'],
      ['negative', '消极信号', '如 提前结束、未问反问'],
      ['judge', '整体判断', '如 大概率通过 / 待定 / 不乐观', 2]
    ]},
  { n: 5, t: '问题与短板', src: 'AI 预填知识漏洞', grad: 'var(--g-aurora)',
    fields: [
      ['knowledge', '知识漏洞', 'AI 由「知识盲区」映射'],
      ['expression', '表达问题', '如 结论前置不够、缺少数据支撑'],
      ['other', '其他', '任何值得记下的问题', 2]
    ]},
  { n: 6, t: '后续行动', src: 'AI 预填下一步', grad: 'var(--g-cool)',
    fields: [
      ['next', '下一步', 'AI 由「下一步」映射', 2],
      ['thanks', '感谢消息', '24 小时内发送的跟进话术', 2],
      ['wrongbook', '错题本 / 查漏补缺', '归入待复习清单', 2]
    ]}
];

const params = new URLSearchParams(location.search);
let curJob = params.get('job');
let expanded = new Set([1, 2, 3]);

/* ══════ 渲染 ══════ */
function renderModules() {
  $('#modules').innerHTML = MODULES.map(m => {
    const open = expanded.has(m.n);
    return `<div class="rv fade">
      <div class="rv-h" data-toggle="${m.n}">
        <div class="rv-n" style="background:${m.grad}">${m.n}</div>
        <div class="rv-t">${m.t}</div>
        <span class="rv-src">${m.src}</span>
        <span class="tag" data-badge="${m.n}">${open ? '收起' : '展开'}</span>
      </div>
      <div class="rv-body" data-body="${m.n}" style="display:${open ? 'block' : 'none'}">
        <div class="rv-fields">
          ${m.fields.map(([k, label, ph, span]) => `
            <div class="field" style="grid-column:${span === 2 ? '1 / -1' : 'auto'}">
              <label class="field-l">${label}</label>
              <textarea class="textarea" data-f="${k}" placeholder="${ph}" style="min-height:${span === 2 ? '110px' : '78px'}"></textarea>
            </div>`).join('')}
        </div>
      </div>
    </div>`;
  }).join('');

  $$('[data-toggle]').forEach(h => h.onclick = () => {
    const n = +h.dataset.toggle;
    expanded.has(n) ? expanded.delete(n) : expanded.add(n);
    const body = $(`[data-body="${n}"]`);
    body.style.display = body.style.display === 'none' ? 'block' : 'none';
    $(`[data-badge="${n}"]`).textContent = body.style.display === 'none' ? '展开' : '收起';
  });
}

function fillJobs() {
  const jobs = Store.jobs.all();
  if (!curJob && jobs.length) curJob = jobs[0].id;
  $('#selJob').innerHTML = jobs.length
    ? jobs.map(j => `<option value="${j.id}"${j.id === curJob ? ' selected' : ''}>${esc(j.company)} · ${esc(j.role)} · ${esc(j.stage)}</option>`).join('')
    : '<option>（暂无记录，请先到「面试记录」添加）</option>';
  loadSaved();
  loadThread();
}

/* ══════ 载入已保存数据 ══════ */
function loadSaved() {
  $$('[data-f]').forEach(el => el.value = '');
  const saved = Store.reviews.get(curJob);
  if (saved?.review) {
    Object.entries(saved.review).forEach(([k, v]) => {
      const el = $(`[data-f="${k}"]`);
      if (el) el.value = v || '';
    });
    $('#saveTag').textContent = '已保存 · ' + (saved.updatedAt || '');
    $('#saveTag').className = 'tag tag-ok';
  } else {
    $('#saveTag').textContent = '未保存';
    $('#saveTag').className = 'tag';
  }

  /* 逐字稿从转写结果带入 */
  const t = saved?.transcript;
  if (t && !$('[data-f="transcript"]').value) {
    $('[data-f="transcript"]').value = t.map(l => `${l.who}：${l.text}`).join('\n');
  }
}

/* ══════ 保存 ══════ */
$('#btnSave').onclick = () => {
  if (!curJob) { Toast.show('请先选择面试记录', 'err'); return; }
  const data = {};
  $$('[data-f]').forEach(el => data[el.dataset.f] = el.value.trim());
  Store.reviews.set(curJob, { review: data });
  $('#saveTag').textContent = '已保存 · ' + today();
  $('#saveTag').className = 'tag tag-ok';
  Toast.show('复盘已保存', 'ok');
};

/* ══════ AI 预填（v1 快速通道 · 只调 1 次，保持原样） ══════ */
$('#btnAI').onclick = async e => {
  const btn = e.currentTarget;
  const transcript = $('[data-f="transcript"]')?.value.trim();
  const stuck = $('[data-f="stuck"]')?.value.trim();
  if (!transcript && !stuck) {
    Toast.show('请先填写逐字稿或卡壳问题（可到「录音转写」页生成）', 'err');
    return;
  }

  btn.disabled = true; btn.textContent = '预填中…';
  expanded.add(3); expanded.add(5); expanded.add(6);

  let raw = '';
  try {
    await LLM.chat(
      [
        { role: 'system', content: '你是面试复盘助手。把逐字稿总结为四个部分，每部分用二级标题开章，格式严格为：`## 一、亮点`、`## 二、知识盲区`、`## 三、改进建议`、`## 四、下一步`（数字用一二三四）。不要加前言或结尾，每部分 2-3 条，具体不空泛。' },
        { role: 'user', content: `逐字稿：\n${transcript}\n\n我卡壳的问题：\n${stuck || '（未填写）'}` }
      ],
      { onToken: c => { raw += c; } }
    );

    const mapped = mapSections(raw);
    let n = 0;
    Object.entries(mapped).forEach(([field, val]) => {
      const el = $(`[data-f="${field}"]`);
      if (el && !el.value.trim()) { el.value = val; n++; }
      if (el) {
        el.style.transition = 'background .6s';
        el.style.background = 'var(--accent-soft)';
        setTimeout(() => el.style.background = '', 900);
      }
    });
    [3, 5, 6].forEach(m => { $(`[data-body="${m}"]`).style.display = 'block'; $(`[data-badge="${m}"]`).textContent = '收起'; });
    Toast.show(`已预填 ${n} 个字段，请校对后保存`, 'ok');
  } catch (err) {
    Toast.show(err.message, 'err');
  } finally {
    btn.disabled = false; btn.textContent = '✦ AI 预填';
  }
};

/* 按 **标题** / ## 标题 分段 → 映射到字段（映射规则见需求文档 3.3）
   ⚠ v1.9.20 前只认「**亮点**」这一种精确格式，而真模型输出的是
   「## 一、亮点」→ 匹配 0 个字段 → 弹窗说已生成、页面却一片空白。
   现在兼容：## 标题 / **加粗**（可带序号、可带冒号）/「一、亮点：」裸行，
   并剥掉「一、/ 1. / （一）」等序号前缀后再查关键词。 */
function mapSections(text) {
  const out = {};
  const KEY = {
    '亮点': 'strength', '优势': 'strength',
    '知识盲区': 'knowledge', '知识漏洞': 'knowledge',
    '改进建议': 'better', '优化标准答案': 'better',
    '下一步': 'next'
  };
  let cur = null;
  const titleOf = (line) => {
    const t = line.trim();
    if (!t) return null;
    const m = t.match(/^#{1,6}\s*(.+?)\s*#*\s*$/)   // ## 一、亮点 / ### 亮点
          || t.match(/^\*\*(.+?)\*\*/)               // **一、亮点**（后面可跟冒号）
          || t.match(/^(.{1,14}?)[：:]\s*$/);        // 「一、亮点：」/「亮点：」整行
    let s = m ? m[1] : t;
    s = s.replace(/^[（(]?\s*[一二三四五六七八九十0-9]{1,3}\s*[)）、.．]\s*/, '')  // 剥序号
         .replace(/\s*[：:]\s*$/, '')
         .trim();
    return KEY[s] || null;   // 只有命中关键词才算标题，防止把正文误判成标题
  };
  text.split('\n').forEach(line => {
    const title = titleOf(line);
    if (title) { cur = title; out[cur] = ''; return; }
    if (cur && line.trim()) out[cur] += (out[cur] ? '\n' : '') + line.trim().replace(/^[-•*]\s*/, '• ').trim();
  });
  return out;
}

/* ════════════════════════════════════════════════
   v2.0 追问式复盘 Agent（三阶段：探针 → 追问 → 收敛）
   - 数据层（Agent.* / Store.threads / Store.agentlog）在 app.js
   - 本段只做 UI 编排；线程状态存 miansu:threads，刷新不丢
   ════════════════════════════════════════════════ */
const TARGET_LABEL = { knowledge: '知识漏洞', gap: '作答漏洞', point: '考察点', better: '优化答案' };

let thread = null;   // 当前 jobId 的追问线程镜像（Store.threads 的同构对象）

function loadThread() { thread = curJob ? Store.threads.get(curJob) : null; }

const curTranscript = () => ($('[data-f="transcript"]')?.value || '').trim();
const curStuck = () => ($('[data-f="stuck"]')?.value || '').trim();

function openDrawer() { $('#deepPanel').classList.remove('hide'); }
function closeDrawer() { $('#deepPanel').classList.add('hide'); }
$('#btnDeepClose').onclick = () => closeDrawer();

/* 阶段一 · 探针：面板显示生成中 */
function renderProbeLoading() {
  $('#probeBody').innerHTML = `
    <div class="chat iv fade">
      <div class="avatar">AI</div>
      <div class="chat-main">
        <div class="who-name">面溯 AI</div>
        <div class="bubble">正在阅读逐字稿，挑出 3 个最值得追问的点…</div>
      </div>
    </div>
    <div class="row" style="gap:8px"><span class="tag tag-info">AI 生成中</span><span class="small muted">请稍候，最多约 30 秒</span></div>`;
  bindReveal();
}

/* 阶段二 · 追问：逐条推送，答完一条出下一条 */
function renderThread() {
  const box = $('#probeBody');
  if (!thread || !thread.probes || !thread.probes.length) {
    box.innerHTML = `
      <div class="empty">
        <div class="empty-ico">✦</div>
        <div class="empty-t">还没有追问线程</div>
        <div class="empty-s">点上方「✦ AI 深挖」开始：AI 先提 3 个问题，你逐条回答后，它结合回答重写复盘</div>
      </div>`;
    bindReveal();
    return;
  }

  const answers = thread.answers || {};
  const skipped = thread.skipped || {};
  const swaps = thread.swaps || {};
  const done = (id) => (id in answers) || !!skipped[id];
  const firstOpen = thread.probes.findIndex(p => !done(p.id));
  const allDone = firstOpen === -1;

  let html = '';
  if (thread.dropped > 0) {
    html += `<div class="small muted" style="padding:0 2px;line-height:1.7">⚠ 有 ${thread.dropped} 条追问因 quote 未在逐字稿中找到而被丢弃</div>`;
  }

  thread.probes.forEach((p, i) => {
    const answered = done(p.id);
    if (!answered && i !== firstOpen) return;   // 逐条推送：只显示当前这条
    const a = answers[p.id] || '';
    html += `
    <div class="probe-q fade">
      <div class="row" style="gap:8px">
        <div class="probe-q-n">${i + 1}</div>
        <span class="tag">${esc(TARGET_LABEL[p.target] || p.target)}</span>
        <span class="small muted" style="margin-left:auto">第 ${i + 1} / ${thread.probes.length} 问</span>
      </div>
      <div class="chat iv">
        <div class="avatar">AI</div>
        <div class="chat-main">
          <div class="who-name">面溯 AI</div>
          <div class="bubble">${esc(p.question)}</div>
        </div>
      </div>
      <div class="probe-q-quote">「${esc(p.quote)}」</div>
      ${!answered ? `
        <textarea class="textarea" data-ans="${p.id}" placeholder="你的回答…（也可以点「跳过」）"></textarea>
        <div class="probe-q-actions">
          <button class="btn btn-primary btn-sm" data-answer="${p.id}">回答</button>
          <button class="btn btn-ghost btn-sm" data-skip="${p.id}">跳过</button>
          ${(swaps[p.id] || 0) < 2 ? `<button class="btn btn-ghost btn-sm" data-swap="${p.id}">换一个问题 · 剩${2 - (swaps[p.id] || 0)}</button>` : ''}
        </div>` : `
        <div class="row" style="gap:8px;margin-top:10px">
          ${skipped[p.id]
            ? `<span class="tag tag-warn">已跳过 · 收敛时该字段以草稿为准</span>`
            : `<span class="tag tag-ok">已回答</span>`}
        </div>
        ${!skipped[p.id] ? `
        <div class="chat me">
          <div class="avatar">我</div>
          <div class="chat-main">
            <div class="who-name">我</div>
            <div class="bubble">${esc(a)}</div>
          </div>
        </div>` : ''}`}
    </div>`;
  });

  if (allDone) {
    html += thread.stage === 'converge' ? `
      <div class="chat iv fade">
        <div class="avatar">AI</div>
        <div class="chat-main">
          <div class="who-name">面溯 AI</div>
          <div class="bubble">复盘已生成，已回填 ${thread.lastFill || 0} 个空字段。请在左侧校对后点「保存复盘」。</div>
        </div>
      </div>
      <button class="btn btn-ghost btn-sm" id="btnDeepAgain">再来一轮深挖</button>` : `
      <div class="probe-finish fade">
        <p class="small muted" style="margin:0 0 12px;line-height:1.7">3 轮追问已完成。点下方按钮，AI 会结合你的回答重写 8 个复盘字段——只回填空字段，你已手填的内容不会被覆盖。</p>
        <button class="btn btn-primary" id="btnConverge">生成完整复盘</button>
      </div>`;
  } else {
    html += `<div class="row" style="gap:8px;padding:2px"><span class="tag tag-warn">待追问</span><span class="small muted">回答当前这条后自动推送下一条</span></div>`;
  }

  box.innerHTML = html;
  bindReveal();

  /* 绑定本轮交互 */
  $$('[data-answer]', box).forEach(b => b.onclick = () => submitAnswer(b.dataset.answer));
  $$('[data-skip]', box).forEach(b => b.onclick = () => skipAnswer(b.dataset.skip));
  $$('[data-swap]', box).forEach(b => b.onclick = () => swapQuestion(b.dataset.swap));
  const c = $('#btnConverge'); if (c) c.onclick = convergeNow;
  const ag = $('#btnDeepAgain'); if (ag) ag.onclick = () => { Store.threads.remove(curJob); thread = null; startDeepFlow(); };
  const ta = $('[data-ans]', box);
  if (ta && window.innerWidth > 720) ta.focus();
}

function submitAnswer(id) {
  const ta = $(`[data-ans="${id}"]`);
  const text = ta ? ta.value.trim() : '';
  if (!text) { Toast.show('先写点内容，或点「跳过」', 'warn'); return; }
  thread.answers[id] = text;
  delete thread.skipped[id];
  Store.threads.set(curJob, thread);
  renderThread();
}

function skipAnswer(id) {
  thread.answers[id] = '';
  thread.skipped[id] = true;
  Store.threads.set(curJob, thread);
  renderThread();
}

async function swapQuestion(id) {
  if ((thread.swaps[id] || 0) >= 2) { Toast.show('这条问题已换过 2 次', 'warn'); return; }
  const btn = $(`[data-swap="${id}"]`);
  if (btn) { btn.disabled = true; btn.textContent = '生成中…'; }
  try {
    const existing = thread.probes.filter(p => p.id !== id).map(p => p.question).join(' / ');
    const r = await Agent.swapProbe({ jobId: curJob, transcript: curTranscript(), stuck: curStuck(), existing });
    if (r && r.probe) {
      const idx = thread.probes.findIndex(p => p.id === id);
      if (idx >= 0) thread.probes[idx] = { ...r.probe, id };
      thread.swaps[id] = (thread.swaps[id] || 0) + 1;
      delete thread.answers[id]; delete thread.skipped[id];   // 问题换了，旧答案作废重问
      Store.threads.set(curJob, thread);
      if (r.fallback) Toast.show('AI 输出格式异常，已用备用问题替换', 'warn');
      renderThread();
      return;
    }
    Toast.show('换问题失败，请稍后再试', 'err');
    if (btn) { btn.disabled = false; btn.textContent = `换一个问题 · 剩${2 - (thread.swaps[id] || 0)}`; }
  } catch (err) {
    Toast.show(err.message || '换问题失败', 'err');
    if (btn) { btn.disabled = false; btn.textContent = `换一个问题 · 剩${2 - (thread.swaps[id] || 0)}`; }
  }
}

/* 阶段三 · 收敛：结合 3 轮问答重写 8 字段，只回填空字段 */
async function convergeNow() {
  const btn = $('#btnConverge');
  if (btn) { btn.disabled = true; btn.textContent = '生成中…'; }
  try {
    const qa = thread.probes.map(p => ({ id: p.id, question: p.question, answer: thread.answers[p.id] || '' }));
    const r = await Agent.runConverge({
      jobId: curJob,
      transcript: curTranscript(),
      stuck: curStuck(),
      qa,
      draft: thread.draft,
      mapFallback: mapSections
    });

    let n = 0;
    Agent.FIELDS.forEach(k => {
      const el = $(`[data-f="${k}"]`);
      const v = String(r.review[k] || '').trim();
      if (!v) return;
      if (el && !el.value.trim()) { el.value = v; n++; }
      if (el) {
        el.style.transition = 'background .6s';
        el.style.background = 'var(--accent-soft)';
        setTimeout(() => { el.style.background = ''; }, 600);
      }
    });
    [3, 5, 6].forEach(m => {
      const b = $(`[data-body="${m}"]`); if (b) b.style.display = 'block';
      const g = $(`[data-badge="${m}"]`); if (g) g.textContent = '收起';
    });

    thread.stage = 'converge';
    thread.lastFill = n;
    Store.threads.set(curJob, thread);
    renderThread();

    if (r.demo) {
      Toast.show('当前为 DEMO 演示模式，追问与复盘均为占位示例，请到「设置」配置 Key 后重试', 'info');
    } else if (r.fallback) {
      Toast.show('AI 输出格式异常，已用备用方式填充，请校对', 'warn');
    } else {
      Toast.show(`已回填 ${n} 个空字段，请校对后保存`, 'ok');
    }
  } catch (err) {
    Toast.show(err.message || '收敛失败，请稍后再试', 'err');
    if (btn) { btn.disabled = false; btn.textContent = '生成完整复盘'; }
  }
}

/* 深挖入口：有线程就续接，没线程就开探针 */
async function startDeepFlow() {
  const transcript = curTranscript(), stuck = curStuck();
  if (!transcript && !stuck) {
    Toast.show('请先填写逐字稿或卡壳问题（可到「录音转写」页生成）', 'err');
    return;
  }
  openDrawer();
  renderProbeLoading();
  try {
    const filled = Agent.FIELDS
      .map(k => ({ k, el: $(`[data-f="${k}"]`) }))
      .filter(x => x.el && x.el.value.trim())
      .map(x => `${x.k}: ${x.el.value.trim().slice(0, 60)}`)
      .join('\n');
    const r = await Agent.runProbe({ jobId: curJob, transcript, stuck, filled });
    thread = { probes: r.probes, answers: {}, skipped: {}, swaps: {}, draft: r.draft, stage: 'thread', dropped: r.dropped || 0 };
    Store.threads.set(curJob, thread);
    if (r.demo) {
      Toast.show('当前为 DEMO 演示模式，追问为占位示例，请到「设置」配置 Key 后重试', 'info');
    } else if (r.fallback) {
      Toast.show('AI 输出格式异常，已用备用方式生成追问，请校对', 'warn');
    }
    renderThread();
  } catch (err) {
    Toast.show(err.message || '深挖失败，请稍后再试', 'err');
    closeDrawer();
  }
}

$('#btnDeep').onclick = async e => {
  if (!curJob) { Toast.show('请先选择面试记录', 'err'); return; }
  const btn = e.currentTarget;
  loadThread();
  if (thread && thread.probes && thread.probes.length) { openDrawer(); renderThread(); return; }
  btn.disabled = true; btn.textContent = '探针中…';
  try { await startDeepFlow(); } finally { btn.disabled = false; btn.textContent = '✦ AI 深挖'; }
};

$('#btnExpand').onclick = e => {
  const all = expanded.size === MODULES.length;
  expanded = new Set(all ? [] : MODULES.map(m => m.n));
  MODULES.forEach(m => {
    $(`[data-body="${m.n}"]`).style.display = expanded.has(m.n) ? 'block' : 'none';
    $(`[data-badge="${m.n}"]`).textContent = expanded.has(m.n) ? '收起' : '展开';
  });
  e.currentTarget.textContent = all ? '全部展开' : '全部收起';
};

$('#selJob').onchange = e => {
  curJob = e.target.value;
  closeDrawer();          // 切换记录时收起追问面板，避免串台
  loadSaved();
  loadThread();
};

renderModules();
fillJobs();
</script>
