<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="app-build" content="v1.9.21">
<title>面试记录 · 面溯</title>
<link rel="stylesheet" href="styles.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg">
</head>
<body>

<div data-nav>
  <nav class="navbar">
    <div class="nav-in">
      <a class="brand" href="index.html">
        <div class="logo serif">溯</div>
        <div><div class="brand-name serif">面溯</div><span class="brand-sub">INTERVIEW REVIEW</span></div>
      </a>
      <div class="menu">
        <a href="index.html">首页</a>
        <a href="records.html">面试记录</a>
        <a href="detail.html">录音转写</a>
        <a href="review.html">面试复盘</a>
        <a href="resume.html">改简历</a>
        <a href="about.html">关于项目</a>
        <a href="settings.html">设置</a>
      </div>
      <div class="nav-right">
        <a class="avatar-btn" href="profile.html" title="登录 / 个人中心">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </a>
      </div>
    </div>
  </nav>
</div>

<div id="main" class="wrap" style="padding:48px 32px 20px">
  <div class="row-between wrap-flex mb-16">
    <div>
      <span class="lbl">Records</span>
      <h1 style="font-size:clamp(28px,4vw,40px);margin:8px 0 6px">面试记录</h1>
      <p class="small muted" style="margin:0">投递流水账。回答「我投了多少、卡在哪一环」。</p>
    </div>
    <button class="btn btn-primary" id="btnNew">+ 新增投递</button>
  </div>

  <!-- 统计 -->
  <div class="grid g3 fade" style="gap:16px;margin-bottom:32px">
    <div class="stat-c"><div class="stat-n" id="sTotal">0</div><div class="stat-l">总投递</div></div>
    <div class="stat-c"><div class="stat-n" id="sActive">0</div><div class="stat-l">进行中</div></div>
    <div class="stat-c"><div class="stat-n" id="sOffer">0</div><div class="stat-l">已 Offer</div></div>
  </div>

  <!-- 列表 -->
  <div class="glass fade" style="padding:26px 28px">
    <div class="tbl-wrap">
      <table class="tbl">
        <thead>
          <tr>
            <th>公司</th><th>岗位</th><th>投递日期</th>
            <th>当前进度</th><th>结果</th><th style="text-align:right">操作</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div id="emptyBox" class="empty hide">
      <div class="empty-ico">📋</div>
      <div class="empty-t">还没有投递记录</div>
      <p class="empty-s">点右上角「新增投递」添加你的第一场面试，或在设置页导入自己的备份 JSON；需要看演示也可直接载入 6 条示例数据。</p>
      <div class="row" style="justify-content:center;gap:10px">
        <button class="btn btn-primary btn-sm" id="btnSeed">载入示例数据</button>
      </div>
    </div>
  </div>
</div>

<!-- 新增弹层 -->
<div id="modal" class="hide" style="position:fixed;inset:0;z-index:200;
     background:rgba(15,23,42,.5);backdrop-filter:blur(6px);
     display:flex;align-items:center;justify-content:center;padding:20px">
  <div class="glass" style="padding:28px 30px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto">
    <div class="row-between mb-24">
      <h2 style="font-size:20px;margin:0">新增投递</h2>
      <button class="icon-btn" id="btnClose" style="width:32px;height:32px">✕</button>
    </div>

    <div class="form-grid">
      <div class="field">
        <label class="field-l">公司</label>
        <input class="input" id="fCompany" placeholder="如 星澜科技">
      </div>
      <div class="field">
        <label class="field-l">岗位</label>
        <input class="input" id="fRole" placeholder="如 AI 产品实习生">
      </div>
      <div class="field">
        <label class="field-l">投递日期</label>
        <input class="input" id="fDate" type="date">
      </div>
      <div class="field">
        <label class="field-l">简历版本</label>
        <input class="input" id="fResume" placeholder="如 v3 · RAG 向">
      </div>
      <div class="field">
        <label class="field-l">当前进度</label>
        <select class="select" id="fStage"></select>
      </div>
      <div class="field">
        <label class="field-l">结果</label>
        <select class="select" id="fResult">
          <option>等待中</option><option>进行中</option>
          <option>已 Offer</option><option>已挂</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label class="field-l">备注</label>
      <input class="input" id="fNote" placeholder="一句话记下这轮的关键信息">
    </div>

    <div class="row" style="justify-content:flex-end;gap:10px">
      <button class="btn btn-ghost" id="btnCancel">取消</button>
      <button class="btn btn-primary" id="btnSave">保存</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
App.mount('records');

const tbody = $('#tbody'), emptyBox = $('#emptyBox');
const modal = $('#modal');

$('#fStage').innerHTML = STAGES.map(s => `<option>${s}</option>`).join('');
$('#fDate').value = today();

/* ══════ 渲染 ══════ */
function render() {
  const jobs = Store.jobs.all();

  $('#sTotal').textContent = jobs.length;
  $('#sActive').textContent = jobs.filter(j => j.result === '进行中' || j.result === '等待中').length;
  $('#sOffer').textContent = jobs.filter(j => j.result === '已 Offer').length;

  if (!jobs.length) { tbody.innerHTML = ''; emptyBox.classList.remove('hide'); return; }
  emptyBox.classList.add('hide');

  tbody.innerHTML = jobs.map(j => `
    <tr>
      <td style="font-weight:700">${esc(j.company)}</td>
      <td class="muted small">${esc(j.role)}</td>
      <td class="muted small mono">${esc(j.date)}</td>
      <td><span class="tag tag-info">${esc(j.stage)}</span></td>
      <td>${resultTag(j.result)}</td>
      <td style="text-align:right">
        <div class="row" style="justify-content:flex-end;gap:7px">
          <a class="btn btn-ghost btn-sm" href="review.html?job=${j.id}">复盘</a>
          <a class="btn btn-ghost btn-sm" href="detail.html?job=${j.id}">录音</a>
          <button class="btn btn-ghost btn-sm" data-del="${j.id}">删除</button>
        </div>
      </td>
    </tr>`).join('');
}

function resultTag(r) {
  const map = { '已 Offer': 'tag-ok', '已挂': 'tag-bad', '进行中': 'tag-info', '等待中': '' };
  return `<span class="tag ${map[r] || ''}">${esc(r)}</span>`;
}

/* ══════ 交互 ══════ */
function open() { modal.classList.remove('hide'); $('#fCompany').focus(); }
function close() { modal.classList.add('hide'); }

$('#btnNew').onclick = open;
$('#btnClose').onclick = close;
$('#btnCancel').onclick = close;
modal.onclick = e => { if (e.target === modal) close(); };

$('#btnSave').onclick = () => {
  const company = $('#fCompany').value.trim();
  if (!company) { Toast.show('请填写公司名称', 'err'); return; }
  Store.jobs.add({
    company,
    role: $('#fRole').value.trim() || 'AI 产品实习生',
    date: $('#fDate').value || today(),
    resume: $('#fResume').value.trim(),
    stage: $('#fStage').value,
    result: $('#fResult').value,
    note: $('#fNote').value.trim()
  });
  close();
  ['#fCompany', '#fRole', '#fResume', '#fNote'].forEach(s => $(s).value = '');
  render();
  Toast.show('已添加投递', 'ok');
};

tbody.addEventListener('click', e => {
  const id = e.target.dataset?.del;
  if (!id) return;
  const j = Store.jobs.get(id);
  if (!confirm(`确认删除「${j.company}」这条投递？相关复盘数据也会一并移除。`)) return;
  Store.jobs.remove(id);
  const rv = Store.reviews.all(); delete rv[id]; Store._write('reviews', rv);
  render();
  Toast.show('已删除', 'ok');
});

$('#btnSeed').onclick = () => { Store.jobs.seed(); render(); Toast.show('已载入 6 条示例', 'ok'); };

render();
</script>
</body>
</html>
